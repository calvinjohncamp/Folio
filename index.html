<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eee6d8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' blob: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://irroinhpcoafwxwlnnbd.supabase.co; manifest-src 'self'; frame-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>Folio Office</title>
<link rel="manifest" href="./manifest.webmanifest?v=jk2">
<link rel="icon" href="./favicon.ico?v=jk1">
<link rel="apple-touch-icon" href="./icon-180.png?v=jk2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=Saira:wght@600&amp;display=swap">
<link rel="stylesheet" href="./login.css?v=3">
<script src="./login.js?v=5" type="module"></script>
</head>
<body>
<main>
<header aria-label="Folio Office"><span class="wordmark" aria-hidden="true"><b>Folio</b><i></i><em>office</em></span></header>
<div class="layout">
<h1 aria-label="Fokus. Auf einer Seite."><span>Fokus.</span><span>Auf einer</span><span>Seite.</span></h1>
<section class="access" aria-label="Folio Office Login">
<h2 id="access-title" hidden>Konto einrichten</h2>
<p class="notice" id="notice" role="status" hidden></p>
<form id="access">
<label id="email-label">E-Mail<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
<div id="code-label" class="code-field" hidden>
<label for="access-code" id="code-title">Einrichtungscode</label>
<div class="code-input">
<input id="access-code" type="password" name="code" inputmode="numeric" autocomplete="off" maxlength="128" disabled aria-describedby="code-hint">
<button id="toggle-code" type="button" aria-label="Code anzeigen" aria-pressed="false" aria-controls="access-code" title="Code anzeigen">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
</button>
</div>
<p id="code-hint" class="code-hint"></p>
</div>
<div class="code-field">
<label for="access-password">Kennwort</label>
<div class="code-input">
<input id="access-password" type="password" name="password" autocomplete="current-password" required maxlength="128" aria-describedby="password-hint">
<button id="toggle-password" type="button" aria-label="Kennwort anzeigen" aria-pressed="false" aria-controls="access-password" title="Kennwort anzeigen">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
</button>
</div>
<p id="password-hint" class="code-hint" hidden>Mindestens acht Zeichen.</p>
</div>
<button type="submit">Login</button>
</form>
<div id="recovery" hidden>
<p>Speichere den achtstelligen Wiederherstellungscode in deinem Passwortmanager. Er wird nur jetzt angezeigt.</p>
<label>Wiederherstellungscode<input id="recovery-code" readonly autocomplete="off"></label>
<p><button id="continue" type="button">Weiter zu Folio Office</button></p>
</div>
<a href="#wiederherstellen" id="switch">Kennwort vergessen?</a>
</section>
</div>
</main>
</body>
</html>
